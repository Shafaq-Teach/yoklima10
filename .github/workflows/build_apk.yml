name: Build Yoqlima Attendance APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure .env exists
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon -x test -x lint 2>&1 | tee build.log || { echo "=== GRADLE FAILED ==="; tail -n 120 build.log; exit 1; }
          echo "=== SEARCHING FOR APK ==="
          find . -name "*.apk" -ls

      - name: Post Failure Log to Issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let content = fs.existsSync('build.log') ? fs.readFileSync('build.log', 'utf8') : '';
            let errorLines = content.split('\n').filter(l => l.startsWith('e: ') || l.includes('e: file://') || l.includes('error:')).slice(0, 60).join('\n');
            if (!errorLines) errorLines = content.split('\n').slice(-120).join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Compilation Errors: ' + context.runNumber,
              body: '```\n' + errorLines + '\n```'
            });

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yoqlima-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(grep -E 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -n1 | sed -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/')
          echo "Found version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          TAG="v$VERSION"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

          if git rev-parse "$TAG" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists. Skipping release creation."
            echo "SHOULD_RELEASE=false" >> $GITHUB_OUTPUT
          else
            echo "Tag $TAG is new! Will create release."
            echo "SHOULD_RELEASE=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        if: (startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')) && steps.get_version.outputs.SHOULD_RELEASE == 'true'
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          name: "Yoqlima Attendance App ${{ steps.get_version.outputs.TAG }}"
          body: "Official Release of Yoqlima Attendance Management APK (${{ steps.get_version.outputs.TAG }})."
          files: app/build/outputs/apk/debug/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
