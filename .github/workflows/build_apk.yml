name: Build Yoqlima Attendance APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ensure .env exists
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon -x test -x lint 2>&1 | tee build.log || { echo "=== GRADLE FAILED ==="; tail -n 120 build.log; exit 1; }
          echo "=== SEARCHING FOR APK ==="
          find . -name "*.apk" -ls

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yoqlima-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Yoqlima Attendance App v1.0.${{ github.run_number }}"
          body: "Automatic build of Yoqlima Attendance Management APK."
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
